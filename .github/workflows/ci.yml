name: Plugin source validation

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build and validate the signed frontend source
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          git diff --exit-code -- com.xsec.desktop/frontend/index.js

  source-preflight:
    needs: manifest
    uses: xsec-labs/xsec-plugins/.github/workflows/first-party-source-preflight.yml@693b80c265ad23d5c537f5611caab79b85dc575b # main
    with:
      plugin_id: com.xsec.workspace.files

  manifest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run the manifest tests
        run: node --test tests/manifest.test.mjs
